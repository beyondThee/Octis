name: Build Octis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── Create Release ────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(cat electron/package.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing release if exists
        run: |
          gh release delete "v${{ steps.get_version.outputs.version }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Octis v${{ steps.get_version.outputs.version }}
          body: |
            ## Download Octis

            | Platform | Download |
            |---|---|
            | Windows | See assets below → Octis-Setup.exe |
            | Mac | See assets below → Octis.dmg |

            ### Installation
            **Windows:** Download and run `Octis Setup ${{ steps.get_version.outputs.version }}.exe`
            **Mac:** Download `Octis-${{ steps.get_version.outputs.version }}.dmg`, open it and drag Octis to Applications
          draft: false
          prerelease: false

  # ── Windows Build ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller flask anthropic openai-whisper sounddevice soundfile numpy torch

      - name: Install ffmpeg
        run: |
          choco install ffmpeg -y

      - name: Write config.py with API key
        run: |
          echo "ANTHROPIC_API_KEY = '${{ secrets.ANTHROPIC_API_KEY }}'" > config.py
        shell: bash

      - name: Update ffmpeg path in spec
        run: |
          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffprobeDir = Split-Path $ffmpegPath
          $ffprobePath = Join-Path $ffprobeDir "ffprobe.exe"
          (Get-Content app_build.spec) `
            -replace "FFMPEG_BIN.*=.*", "FFMPEG_BIN  = r'$ffmpegPath'" `
            -replace "FFPROBE_BIN.*=.*", "FFPROBE_BIN = r'$ffprobePath'" |
            Set-Content app_build.spec
        shell: powershell

      - name: Build Python backend
        run: |
          pyinstaller app_build.spec --noconfirm --distpath dist_python

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run build-win

      - name: Upload Windows installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: dist_electron/Octis Setup ${{ needs.create-release.outputs.version }}.exe
          asset_name: Octis-Setup.exe
          asset_content_type: application/octet-stream

  # ── Mac Build ─────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller flask anthropic openai-whisper sounddevice soundfile numpy torch

      - name: Install ffmpeg
        run: |
          brew install ffmpeg

      - name: Write config.py with API key
        run: |
          echo "ANTHROPIC_API_KEY = '${{ secrets.ANTHROPIC_API_KEY }}'" > config.py

      - name: Create Mac PyInstaller spec
        run: |
          cat > app_build_mac.spec << 'EOF'
          from PyInstaller.utils.hooks import collect_data_files
          import subprocess

          block_cipher = None

          ffmpeg_path  = subprocess.check_output(['which', 'ffmpeg']).decode().strip()
          ffprobe_path = subprocess.check_output(['which', 'ffprobe']).decode().strip()

          whisper_datas = collect_data_files('whisper')

          a = Analysis(
              ['app.py'],
              pathex=[],
              binaries=[
                  (ffmpeg_path,  '.'),
                  (ffprobe_path, '.'),
              ],
              datas=[
                  ('templates', 'templates'),
                  ('static',    'static'),
                  ('config.py', '.'),
                  *whisper_datas,
              ],
              hiddenimports=[
                  'flask', 'anthropic', 'whisper',
                  'sounddevice', 'soundfile', 'numpy',
                  'torch', 'tiktoken',
                  'tiktoken_ext', 'tiktoken_ext.openai_public',
              ],
              hookspath=[],
              runtime_hooks=['hook_ffmpeg.py'],
              excludes=['webview'],
              cipher=block_cipher,
              noarchive=False,
          )

          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

          exe = EXE(
              pyz, a.scripts, [],
              exclude_binaries=True,
              name='app',
              debug=False, strip=False, upx=True,
              console=False,
          )

          coll = COLLECT(
              exe, a.binaries, a.zipfiles, a.datas,
              strip=False, upx=True, upx_exclude=[],
              name='app',
          )
          EOF

      - name: Build Python backend for Mac
        run: |
          pyinstaller app_build_mac.spec --noconfirm --distpath dist_python

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      - name: Build Mac DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run build-mac

      - name: Upload Mac DMG to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: dist_electron/Octis-${{ needs.create-release.outputs.version }}.dmg
          asset_name: Octis.dmg
          asset_content_type: application/octet-stream

