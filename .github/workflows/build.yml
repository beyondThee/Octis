name: Build Octis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # lets electron-builder create the release and upload assets

jobs:

  # ── Windows Build ─────────────────────────────────────────────
  build-windows:
    # Only main publishes Windows releases. A manual run on another
    # branch builds just the Mac test app.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller flask requests openai-whisper sounddevice soundfile numpy torch

      - name: Install ffmpeg and update spec paths
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress

          # A new step starts a fresh shell, so pull in the PATH that
          # chocolatey just modified instead of relying on the old one.
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path","User")

          $ffmpegPath = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source

          # Fallback: search chocolatey's install locations directly
          if (-not $ffmpegPath) {
            Write-Host "ffmpeg not on PATH - searching install directories..."
            $hit = Get-ChildItem -Path "C:\ProgramData\chocolatey","C:\tools" `
                     -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) { $ffmpegPath = $hit.FullName }
          }

          if (-not $ffmpegPath) {
            Write-Error "ffmpeg could not be found after install"
            exit 1
          }

          $ffprobeDir  = Split-Path $ffmpegPath
          $ffprobePath = Join-Path $ffprobeDir "ffprobe.exe"

          if (-not (Test-Path $ffprobePath)) {
            $probeHit = Get-ChildItem -Path "C:\ProgramData\chocolatey","C:\tools" `
                          -Filter ffprobe.exe -Recurse -ErrorAction SilentlyContinue |
                        Select-Object -First 1
            if ($probeHit) { $ffprobePath = $probeHit.FullName }
          }

          Write-Host "ffmpeg : $ffmpegPath"
          Write-Host "ffprobe: $ffprobePath"

          (Get-Content app_build.spec) `
            -replace "FFMPEG_BIN.*=.*", "FFMPEG_BIN  = r'$ffmpegPath'" `
            -replace "FFPROBE_BIN.*=.*", "FFPROBE_BIN = r'$ffprobePath'" |
            Set-Content app_build.spec

      - name: Write config.py
        run: |
          echo "ANTHROPIC_API_KEY = ''" > config.py
        shell: bash

      - name: Build Python backend
        run: |
          pyinstaller app_build.spec --noconfirm --distpath dist_python

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      # electron-builder creates the release, builds the installer,
      # generates latest.yml, and uploads ALL of it to GitHub.
      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npx electron-builder --win --publish always

  # ── Mac Build ─────────────────────────────────────────────────
  # Builds an Apple Silicon (M1/M2/M3/M4) app.
  #
  # Signing + notarizing switch on by themselves once these repo
  # secrets exist (Settings > Secrets and variables > Actions):
  #   MAC_CERT_P12           base64 of the Developer ID .p12 file
  #   MAC_CERT_PASSWORD      password of that .p12
  #   APPLE_ID               Apple Developer account email
  #   APPLE_APP_PASSWORD     app-specific password (account.apple.com)
  #   APPLE_TEAM_ID          10-character Team ID
  #
  # The Mac app is NOT added to the release until the repo variable
  # MAC_RELEASE is set to "true". Until then it's only a test
  # download on the workflow run page ("Artifacts" section).
  build-mac:
    runs-on: macos-latest
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
      MAC_RELEASE: ${{ vars.MAC_RELEASE == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller flask requests certifi openai-whisper sounddevice soundfile numpy torch

      - name: Write config.py
        run: |
          echo "ANTHROPIC_API_KEY = ''" > config.py

      - name: Build Python backend for Mac
        run: |
          pyinstaller app_build_mac.spec --noconfirm --distpath dist_python
          ls -la dist_python/app/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      # electron-builder builds the DMG + ZIP (the ZIP is what Mac
      # auto-update downloads) and latest-mac.yml.
      - name: Build Mac app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd electron
          ARGS="--mac --arm64"

          if [ "$HAS_MAC_CERT" = "true" ]; then
            ARGS="$ARGS -c.mac.notarize=true"
          else
            echo "No signing certificate yet - building an UNSIGNED test app."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          # Only publish a signed app, and only once MAC_RELEASE is on.
          if [ "$MAC_RELEASE" = "true" ] && [ "$HAS_MAC_CERT" = "true" ]; then
            npx electron-builder $ARGS --publish always
          else
            npx electron-builder $ARGS --publish never
          fi

      - name: Upload Mac test build
        uses: actions/upload-artifact@v4
        with:
          name: quick-notes-mac
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
          retention-days: 14
