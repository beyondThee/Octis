name: Build Octis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # lets electron-builder create the release and upload assets

jobs:

  # ── Windows Build ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller flask requests openai-whisper sounddevice soundfile numpy torch

      - name: Install ffmpeg and update spec paths
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress

          # A new step starts a fresh shell, so pull in the PATH that
          # chocolatey just modified instead of relying on the old one.
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path","User")

          $ffmpegPath = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source

          # Fallback: search chocolatey's install locations directly
          if (-not $ffmpegPath) {
            Write-Host "ffmpeg not on PATH - searching install directories..."
            $hit = Get-ChildItem -Path "C:\ProgramData\chocolatey","C:\tools" `
                     -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) { $ffmpegPath = $hit.FullName }
          }

          if (-not $ffmpegPath) {
            Write-Error "ffmpeg could not be found after install"
            exit 1
          }

          $ffprobeDir  = Split-Path $ffmpegPath
          $ffprobePath = Join-Path $ffprobeDir "ffprobe.exe"

          if (-not (Test-Path $ffprobePath)) {
            $probeHit = Get-ChildItem -Path "C:\ProgramData\chocolatey","C:\tools" `
                          -Filter ffprobe.exe -Recurse -ErrorAction SilentlyContinue |
                        Select-Object -First 1
            if ($probeHit) { $ffprobePath = $probeHit.FullName }
          }

          Write-Host "ffmpeg : $ffmpegPath"
          Write-Host "ffprobe: $ffprobePath"

          (Get-Content app_build.spec) `
            -replace "FFMPEG_BIN.*=.*", "FFMPEG_BIN  = r'$ffmpegPath'" `
            -replace "FFPROBE_BIN.*=.*", "FFPROBE_BIN = r'$ffprobePath'" |
            Set-Content app_build.spec

      - name: Write config.py
        run: |
          echo "ANTHROPIC_API_KEY = ''" > config.py
        shell: bash

      - name: Build Python backend
        run: |
          pyinstaller app_build.spec --noconfirm --distpath dist_python

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      # electron-builder creates the release, builds the installer,
      # generates latest.yml, and uploads ALL of it to GitHub.
      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npx electron-builder --win --publish always

  # ── Mac Build ─────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller flask requests openai-whisper sounddevice soundfile numpy torch

      - name: Install ffmpeg
        run: |
          brew install ffmpeg

      - name: Write config.py
        run: |
          echo "ANTHROPIC_API_KEY = ''" > config.py

      - name: Create Mac PyInstaller spec
        run: |
          cat > app_build_mac.spec << 'EOF'
          from PyInstaller.utils.hooks import collect_data_files
          import subprocess

          block_cipher = None

          ffmpeg_path  = subprocess.check_output(['which', 'ffmpeg']).decode().strip()
          ffprobe_path = subprocess.check_output(['which', 'ffprobe']).decode().strip()

          whisper_datas = collect_data_files('whisper')

          a = Analysis(
              ['app.py'],
              pathex=[],
              binaries=[
                  (ffmpeg_path,  '.'),
                  (ffprobe_path, '.'),
              ],
              datas=[
                  ('templates', 'templates'),
                  ('static',    'static'),
                  ('config.py', '.'),
                  *whisper_datas,
              ],
              hiddenimports=['whisper'],
              hookspath=[],
              runtime_hooks=[],
              excludes=[],
              cipher=block_cipher,
          )
          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
          exe = EXE(
              pyz, a.scripts, [],
              exclude_binaries=True,
              name='app',
              console=False,
          )
          coll = COLLECT(
              exe, a.binaries, a.zipfiles, a.datas,
              name='app',
          )
          EOF

      - name: Build Python backend for Mac
        run: |
          pyinstaller app_build_mac.spec --noconfirm --distpath dist_python
          echo "Python build complete"
          ls -la dist_python/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      # electron-builder builds the DMG, generates latest-mac.yml,
      # and uploads both to the same GitHub release.
      - name: Build and publish Mac DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npx electron-builder --mac --publish always
